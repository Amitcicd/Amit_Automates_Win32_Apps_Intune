name: 🚀 Intune Win32 App — Build, Package & Deploy (OIDC)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force update even if version unchanged"
        required: false
        default: "false"
        type: boolean

concurrency:
  group: intune-deploy
  cancel-in-progress: false

env:
  INTUNEWINAPPUTIL_URL: "https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/raw/master/IntuneWinAppUtil.exe"
  OUTPUT_DIR: "output"

jobs:
  # ──────────────────────────────────────────────
  # JOB 1 — Read config & extract version
  # ──────────────────────────────────────────────
  prepare:
    name: 📋 Read Config & Detect Version
    runs-on: windows-latest
    outputs:
      app_name:       ${{ steps.cfg.outputs.app_name }}
      app_version:    ${{ steps.ver.outputs.app_version }}
      setup_file:     ${{ steps.cfg.outputs.setup_file }}
      installer_type: ${{ steps.cfg.outputs.installer_type }}
      install_cmd:    ${{ steps.cfg.outputs.install_cmd }}
      uninstall_cmd:  ${{ steps.cfg.outputs.uninstall_cmd }}
      publisher:      ${{ steps.cfg.outputs.publisher }}
      description:    ${{ steps.cfg.outputs.description }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app-config.json
        id: cfg
        shell: pwsh
        run: |
          $c = Get-Content "app-config.json" | ConvertFrom-Json
          "app_name=$($c.displayName)"           >> $env:GITHUB_OUTPUT
          "setup_file=$($c.setupFile)"            >> $env:GITHUB_OUTPUT
          "installer_type=$($c.installerType)"    >> $env:GITHUB_OUTPUT
          "install_cmd=$($c.installCommand)"      >> $env:GITHUB_OUTPUT
          "uninstall_cmd=$($c.uninstallCommand)"  >> $env:GITHUB_OUTPUT
          "publisher=$($c.publisher)"             >> $env:GITHUB_OUTPUT
          "description=$($c.description)"         >> $env:GITHUB_OUTPUT

      - name: Extract installer version
        id: ver
        shell: pwsh
        run: |
          $version = .\scripts\Get-InstallerVersion.ps1 `
            -InstallerPath "app\${{ steps.cfg.outputs.setup_file }}" `
            -InstallerType "${{ steps.cfg.outputs.installer_type }}"
          Write-Host "✅ Detected version: $version"
          "app_version=$version" >> $env:GITHUB_OUTPUT

  # ──────────────────────────────────────────────
  # JOB 2 — Build .intunewin package
  # ──────────────────────────────────────────────
  build:
    name: 📦 Build .intunewin
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download IntuneWinAppUtil.exe
        shell: pwsh
        run: |
          Write-Host "⬇️  Downloading IntuneWinAppUtil..."
          Invoke-WebRequest -Uri $env:INTUNEWINAPPUTIL_URL `
            -OutFile "IntuneWinAppUtil.exe" -UseBasicParsing
          Write-Host "✅ Tool ready"

      - name: Build .intunewin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:OUTPUT_DIR -Force | Out-Null
          .\IntuneWinAppUtil.exe `
            -c app `
            -s "${{ needs.prepare.outputs.setup_file }}" `
            -o $env:OUTPUT_DIR `
            -q
          $pkg = Get-ChildItem -Path $env:OUTPUT_DIR -Filter "*.intunewin" | Select-Object -First 1
          if (-not $pkg) { throw "❌ .intunewin not created!" }
          Write-Host "✅ Package: $($pkg.Name) ($([math]::Round($pkg.Length/1MB,2)) MB)"

      - name: Upload .intunewin artifact
        uses: actions/upload-artifact@v4
        with:
          name: intunewin-${{ needs.prepare.outputs.app_name }}-v${{ needs.prepare.outputs.app_version }}-run${{ github.run_number }}
          path: output/*.intunewin
          retention-days: 90
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # JOB 3 — Deploy to Intune via OIDC (no secret)
  # ──────────────────────────────────────────────
  deploy:
    name: 🚢 Deploy to Intune (OIDC)
    runs-on: windows-latest
    needs: [prepare, build]
    environment: production

    # ⬇️  OIDC requires these two permissions — same as your primaryuser workflow
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download .intunewin artifact
        uses: actions/download-artifact@v4
        with:
          name: intunewin-${{ needs.prepare.outputs.app_name }}-v${{ needs.prepare.outputs.app_version }}-run${{ github.run_number }}
          path: output

      # ── OIDC login — same action your primaryuser workflow uses ──────────────
      - name: Login to Azure (OIDC — no secret)
        uses: azure/login@v2
        with:
          client-id:  ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:  ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true   # no Azure sub needed, Graph only
          enable-AzPSSession: true       # enables Get-AzAccessToken in pwsh

      # ── Deploy using azure/powershell so Az context is inherited ────────────
      - name: Deploy to Intune
        uses: azure/powershell@v2
        with:
          azPSVersion: latest
          inlineScript: |
            $pkg = Get-ChildItem -Path output -Filter "*.intunewin" | Select-Object -First 1
            $env:INTUNEWIN_PATH  = $pkg.FullName
            $env:APP_NAME        = "${{ needs.prepare.outputs.app_name }}"
            $env:APP_VERSION     = "${{ needs.prepare.outputs.app_version }}"
            $env:APP_PUBLISHER   = "${{ needs.prepare.outputs.publisher }}"
            $env:APP_DESC        = "${{ needs.prepare.outputs.description }}"
            $env:INSTALL_CMD     = "${{ needs.prepare.outputs.install_cmd }}"
            $env:UNINSTALL_CMD   = "${{ needs.prepare.outputs.uninstall_cmd }}"
            $env:FORCE_UPDATE    = "${{ github.event.inputs.force_update || 'false' }}"
            .\scripts\Deploy-IntuneApp.ps1

  # ──────────────────────────────────────────────
  # JOB 4 — GitHub Release (audit trail)
  # ──────────────────────────────────────────────
  release:
    name: 🏷️ Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, deploy]
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download .intunewin artifact
        uses: actions/download-artifact@v4
        with:
          name: intunewin-${{ needs.prepare.outputs.app_name }}-v${{ needs.prepare.outputs.app_version }}-run${{ github.run_number }}
          path: output

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ needs.prepare.outputs.app_version }}-${{ github.run_number }}"
          name: "${{ needs.prepare.outputs.app_name }} — v${{ needs.prepare.outputs.app_version }} (#${{ github.run_number }})"
          body: |
            ## 📦 Deployment Summary

            | Field         | Value |
            |---------------|-------|
            | **App**       | ${{ needs.prepare.outputs.app_name }} |
            | **Version**   | ${{ needs.prepare.outputs.app_version }} |
            | **Publisher** | ${{ needs.prepare.outputs.publisher }} |
            | **Assigned**  | All Devices (Required) |
            | **Auth**      | OIDC — no secrets stored |
            | **Run**       | #${{ github.run_number }} |
            | **Commit**    | `${{ github.sha }}` |
            | **Actor**     | `${{ github.actor }}` |

            ## 🔗 Links
            - [Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - [Commit diff](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ---
            *Deployed via GitHub Actions OIDC → Microsoft Intune Graph API*
          files: output/*.intunewin
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
